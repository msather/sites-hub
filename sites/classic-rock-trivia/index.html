<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Classic Rock Trivia</title>
<meta name="description" content="Five-question classic rock trivia: pick the song the artist really recorded.">
<link rel="icon" href="favicon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header class="poster">
    <p class="kicker">Tonight only</p>
    <h1>Classic Rock<br><span>Trivia</span></h1>
    <p class="sub">Five questions. Four songs each. Only the real ones count.</p>
  </header>

  <section id="start" class="panel">
    <p>We name a band. You pick the song they actually recorded (or, sometimes, the one they didn't).</p>
    <button id="play" class="big">Start the show</button>
    <p class="muted" id="bankInfo"></p>
  </section>

  <section id="quiz" class="panel" hidden>
    <p class="progress" id="progress"></p>
    <h2 id="question"></h2>
    <div id="options" class="options"></div>
    <p id="feedback" class="feedback" aria-live="polite"></p>
    <button id="next" class="big" hidden>Next</button>
  </section>

  <section id="results" class="panel" hidden>
    <h2 id="score"></h2>
    <p id="verdict"></p>
    <div id="review"></div>
    <button id="again" class="big">Play again with new questions</button>
  </section>
</main>
<footer><small>Songs are checked against a built-in list. Covers and duets are left out on purpose.</small></footer>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
