name: Create site

# Manual workflow. Run it from the Actions tab ("Run workflow"), or let an agent trigger it.
on:
  workflow_dispatch:
    inputs:
      name:
        description: "Site name: lowercase letters, digits, hyphens (2-39 chars)"
        required: true
        type: string
      description:
        description: "One-line description of the site"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: create-site
  cancel-in-progress: false

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Create site from templates/site-starter and commit to the hub
        env:
          NAME: ${{ inputs.name }}
          DESCRIPTION: ${{ inputs.description }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Always build on the newest main, and retry if another run pushed first.
          for attempt in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard origin/main
            python3 scripts/new_site.py --name "$NAME" --description "$DESCRIPTION" || exit 1
            git add sites.md sites
            git commit -q -m "Add site: $NAME"
            if git push -q origin HEAD:main; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push raced with another change, retrying..."
            sleep $((attempt * 3))
          done
          echo "::error::Could not push after 5 attempts"
          exit 1

  deploy:
    needs: create
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
