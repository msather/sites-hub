name: Create site

# Manual workflow. Run it from the Actions tab ("Run workflow"), or let an agent trigger it.
on:
  workflow_dispatch:
    inputs:
      name:
        description: "Site name: lowercase letters, digits, hyphens (2-39 chars)"
        required: true
        type: string
      description:
        description: "One-line description of the site"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: create-site
  cancel-in-progress: false

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate and render site from templates/site-starter
        env:
          NAME: ${{ inputs.name }}
          DESCRIPTION: ${{ inputs.description }}
        run: |
          python3 scripts/new_site.py --name "$NAME" --description "$DESCRIPTION"

      - name: Commit registry and files to the hub
        env:
          NAME: ${{ inputs.name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sites.md sites
          git commit -m "Add site: $NAME"
          git pull --rebase -q origin main
          git push origin HEAD:main

  deploy:
    needs: create
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
